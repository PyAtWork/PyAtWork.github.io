<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% include nav.html %}
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: "%Y" }} {{ site.title }}</span>
    <span class="footer-links">
      <a href="mailto:dinschuetz@web.de">Email</a>
      <a href="https://www.linkedin.com/in/nadineberner/">LinkedIn</a>
      <a href="https://github.com/pyatwork">GitHub</a>
      <a href="https://scholar.google.de/citations?user=LOjiOkkAAAAJ&hl=en&oi=ao">Scholar</a>
      <a href="https://orcid.org/0000-0002-1843-2747">ORCID</a>
    </span>
  </footer>

</body>
</html>
